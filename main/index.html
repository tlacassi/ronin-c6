<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Ronin C6</title>
<style>body{background:#101821;color:#edf4fa;font:16px system-ui;text-align:center;margin:2rem auto;max-width:34rem;padding:0 1rem}h1{font-size:1.5rem}#status{color:#ffcd73}#pad{width:240px;height:240px;border-radius:50%;background:#263848;border:2px solid #87a9bf;touch-action:none;position:relative;margin:2rem auto}#knob{width:64px;height:64px;border-radius:50%;background:#54c5b7;position:absolute;left:88px;top:88px;pointer-events:none}button{background:#8c3440;color:white;border:0;border-radius:8px;padding:1rem 2rem;font-size:1rem}small{display:block;color:#a4b6c3;line-height:1.5;margin:1rem}</style>
<h1>Ronin C6</h1><p id="status">Recherche du Ronin…</p><div id="pad" aria-label="Joystick panoramique et inclinaison"><div id="knob"></div></div><button id="stop">ARRÊTER</button><small>Maintenir et déplacer le joystick. Relâcher pour arrêter.<br>Focus et positions absolues : non disponibles dans cette version. Sens des axes à vérifier au premier essai.</small>
<script>
const pad=document.querySelector('#pad'),knob=document.querySelector('#knob'),label=document.querySelector('#status');let active=false,x=0,y=0,inflight=false;
function neutral(){active=false;x=0;y=0;knob.style.transform='translate(0px,0px)';send()}
async function send(){if(inflight)return;inflight=true;let sentX=x,sentY=y;try{let r=await fetch('/move',{method:'POST',headers:{'Content-Type':'text/plain'},body:`${sentX},${sentY}`,cache:'no-store'});if(!r.ok)neutralLocal()}catch(e){neutralLocal()}finally{inflight=false;if(sentX!==x||sentY!==y)send()}}
function neutralLocal(){active=false;x=0;y=0;knob.style.transform='translate(0px,0px)'}
function position(e){let r=pad.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),scale=Math.min(1,88/Math.hypot(dx,dy));dx*=scale;dy*=scale;knob.style.transform=`translate(${dx}px,${dy}px)`;x=Math.round(dx/88*300);y=Math.round(-dy/88*300)}
pad.onpointerdown=e=>{active=true;pad.setPointerCapture(e.pointerId);position(e);send()};pad.onpointermove=e=>{if(active)position(e)};pad.onpointerup=neutral;pad.onpointercancel=neutral;pad.onlostpointercapture=neutral;document.querySelector('#stop').onclick=neutral;window.onblur=neutral;document.addEventListener('visibilitychange',()=>{if(document.hidden)neutral()});setInterval(()=>{if(active)send()},100);setInterval(async()=>{try{let r=await fetch('/status',{cache:'no-store'}),s=await r.json();label.textContent=s.ble?'BLE connecté — commandes sans retour de confirmation':'Ronin non connecté';if(!s.ble)neutralLocal()}catch(e){label.textContent='ESP inaccessible';neutralLocal()}},1000);
</script></html>
